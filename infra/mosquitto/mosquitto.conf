# ColdGuard — Mosquitto MQTT broker configuration
# Mounted into the container at /mosquitto/config/mosquitto.conf
#
# DEMO MODE: anonymous access allowed on the local network only.
# For anything beyond a hackathon demo, see "Hardening" at the bottom.

# Allow connections on IPv4 and IPv6, all interfaces.
listener 1883
# listener 1883 0.0.0.0
# listener 1883 ::

# Demo mode: no authentication required (any client can pub/sub).
allow_anonymous true

# --- Optional: TLS listener on 8883 (uncomment once you have certs) ---
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2
# tls_version tlsv1.3

# --- Optional: authenticated listener for production-like setup ---
# listener 8884
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Persistence: keep retained messages across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout/stderr so `docker compose logs mosquitto` works.
log_dest stdout
log_dest stderr
log_type all

# --- Hardening (for a real deployment, NOT needed for the demo) ---
# allow_anonymous false
# password_file /mosquitto/config/passwd
# Generate the file inside the container:
#   docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd coldguard
# Then set MQTT_USERNAME / MQTT_PASSWORD in .env and pass them to the backend.
