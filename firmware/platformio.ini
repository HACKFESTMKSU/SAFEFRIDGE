; PlatformIO project for ColdGuard ESP32 firmware
; Docs: https://docs.platformio.org/en/latest/projectconf/
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Dependencies (FR: DHT, BMP180, JSON) ---
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit BMP085 Library@^2.6.5
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8

; LittleFS is built into the Arduino ESP32 core (used for the offline
; telemetry ring buffer, FR-14). No extra lib needed.

; --- Build-time credential overrides (optional, safer than editing config.h) ---
; Example:  pio run -t upload -D WIFI_SSID='"MySSID"' -D WIFI_PASS='"secret"'
;           pio run -t upload -D MQTT_HOST='"192.168.1.10"' -D DEVICE_ID='"CG-002"'
build_flags =
    -D WIFI_SSID='"YOUR_WIFI"'
    -D WIFI_PASS='"YOUR_WIFI_PASS"'
    -D MQTT_HOST='"192.168.x.x"'
    -D DEVICE_ID='"CG-001"'
    -D ENABLE_SMS=1

; Monitor speed must match nothing special; debug prints are 115200.
monitor_speed = 115200

; Flash size: default 4MB is fine. If buffer grows, LittleFS uses the
; remaining flash partition automatically.
upload_speed = 921600
